let seriesData;try{seriesData=JSON.parse(localStorage.getItem('lib-series-v1'))||seriesSeed}catch{seriesData=seriesSeed}function saveSeries(){localStorage.setItem('lib-series-v1',JSON.stringify(seriesData))}function heldBook(s,v){return books.find(b=>b.owner===s.owner&&b.title.toLowerCase()===v.title.toLowerCase())}function seriesNumbers(s){return {held:s.volumes.filter(v=>heldBook(s,v)).length,read:s.volumes.filter(v=>v.read).length,total:s.volumes.length}}function renderSeries(){document.getElementById('pageTitle').textContent='One story leads to another.';document.getElementById('subtitle').textContent='Keep series in order. See what you own and what comes next.';let q=document.getElementById('search').value.toLowerCase(),ss=seriesData.filter(s=>s.owner===owner&&[s.name,s.author,...s.volumes.map(v=>v.title)].join(' ').toLowerCase().includes(q));let missing=ss.reduce((n,s)=>n+seriesNumbers(s).total-seriesNumbers(s).held,0);document.getElementById('content').innerHTML=`<div class="stats"><div class="stat"><strong>${ss.length}</strong><span>Series in ${owner}’s collection</span></div><div class="stat"><strong>${missing}</strong><span>Missing from entered volumes</span></div><div class="stat"><strong>${ss.filter(s=>seriesNumbers(s).held===s.volumes.length&&s.volumes.length).length}</strong><span>All entered volumes owned</span></div></div><div class="paneltop"><h2>Book series</h2><button class="primary" onclick="editSeries()">＋ New series</button></div><p class="seriesnote" style="font-size:11px;margin-bottom:18px">Sample series and partial volume lists · Live Librarium catalogue sync is not connected.</p><div class="seriesgrid">${ss.map(s=>{let n=seriesNumbers(s);return `<button class="seriescard" onclick="openSeries('${s.id}')"><div class="seriesart">${s.volumes.slice(0,5).map((v,i)=>`<span style="background:${heldBook(s,v)?.color||'#e2e5dc'};color:${heldBook(s,v)?'#fff8e4':'#85907f'};transform:translateY(${i%2?5:0}px)">${i+1}</span>`).join('')}</div><div class="eyebrow">${esc(s.status)} · ${esc(s.owner)}</div><h2>${esc(s.name)}</h2><p>${esc(s.author)}</p><div class="seriesprogress"><i style="width:${n.total?n.held/n.total*100:0}%"></i></div><div class="seriesmeta"><span>${n.held} / ${n.total} owned</span><span>${n.total-n.held?`${n.total-n.held} missing`:'All owned'}</span></div><p style="font-size:11px;margin-top:9px">${n.read} read · ${new Set(s.volumes.map(v=>v.arc).filter(Boolean)).size} arcs</p></button>`}).join('')}</div>${ss.length?'':'<div class="emptymsg">No series here yet. Create a series and add its volumes.</div>'}`}
function openSeries(id){let s=seriesData.find(s=>s.id===id),n=seriesNumbers(s);show(`<div class="eyebrow">${esc(s.owner)}’s collection · ${esc(s.status)}</div><h1 style="font-size:36px">${esc(s.name)}</h1><p>${esc(s.author)} · ${n.held}/${n.total} owned · ${n.read} read</p><div class="shelfBooks">${s.volumes.map((v,i)=>{let b=heldBook(s,v);return `<div class="volume"><span class="volnumber">${i+1}</span><div class="voltext"><b>${esc(v.title)}</b><small>${v.arc?esc(v.arc)+' · ':''}${b?'Owned · '+(b.shelf||'Not shelved'):'Missing from collection'}</small><div class="volactions">${b?`<button onclick="openBook(${b.id})">View book</button><button onclick="toggleVolumeRead('${id}',${i})">${v.read?'✓ Read':'Mark read'}</button>`:`<button onclick="assignVolume('${id}',${i})">Link existing book</button><button onclick="addSeriesVolume('${id}',${i})">Add book</button>`}</div></div></div>`}).join('')||'<p>No volumes entered.</p>'}</div><div class="actions"><button onclick="editSeries('${id}')">Edit series / volumes</button><button onclick="modal.close()">Close</button></div>`)}
function toggleVolumeRead(id,index){let s=seriesData.find(s=>s.id===id);s.volumes[index].read=!s.volumes[index].read;saveSeries();render();openSeries(id)}function addSeriesVolume(id,index){let s=seriesData.find(s=>s.id===id);owner=s.owner;render();openBook();let f=document.getElementById('bookForm');f.elements.title.value=s.volumes[index].title;f.elements.author.value=s.author}
function editSeries(id){let s=seriesData.find(s=>s.id===id);show(`<div class="eyebrow">Series management</div><h2>${s?'Edit series':'Create a series'}</h2><form id="seriesForm" onsubmit="event.preventDefault();saveSeriesForm('${id||''}')"><label for="seriesName">Series name</label><input id="seriesName" name="name" required value="${esc(s?.name||'')}"><label for="seriesAuthor">Author</label><input id="seriesAuthor" name="author" value="${esc(s?.author||'')}"><label for="seriesOwner">Collection</label><select id="seriesOwner" name="owner">${['Safi','Adam','Caleb'].map(o=>`<option ${o===(s?.owner||owner)?'selected':''}>${o}</option>`).join('')}</select><label for="seriesStatus">Status</label><select id="seriesStatus" name="status">${['Ongoing','Completed','Unknown'].map(o=>`<option ${o===(s?.status||'Ongoing')?'selected':''}>${o}</option>`).join('')}</select><label for="seriesVolumes">Volumes in reading order</label><textarea id="seriesVolumes" name="volumes" rows="6" placeholder="One title per line. Optional: Title | Arc name">${esc(s?.volumes.map(v=>v.title+(v.arc?' | '+v.arc:'')).join('\n')||'')}</textarea><p style="font-size:11px">One title per line. Add “ | Arc name” to group story arcs. Reorder lines to change volume order. Existing books link by title within this collection.</p><div class="actions">${s?`<button type="button" class="danger" onclick="confirmDeleteSeries('${id}')">Delete series</button>`:''}<button type="button" onclick="modal.close()">Cancel</button><button class="primary">Save series</button></div></form>`)}
function saveSeriesForm(id){let f=document.getElementById('seriesForm'),data=Object.fromEntries(new FormData(f)),old=seriesData.find(s=>s.id===id),volumes=data.volumes.split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{let [title,...arc]=line.split('|');return {title:title.trim(),arc:arc.join('|').trim(),read:old?.volumes.find(v=>v.title===title.trim())?.read||false}}),s={id:id||'series-'+Date.now(),name:data.name.trim(),author:data.author.trim(),owner:data.owner,status:data.status,volumes};seriesData=id?seriesData.map(x=>x.id===id?s:x):[...seriesData,s];saveSeries();owner=s.owner;render();openSeries(s.id);toast('Series saved')}
function assignVolume(id,index){let s=seriesData.find(s=>s.id===id),available=books.filter(b=>b.owner===s.owner);show(`<h2>Link an existing book</h2><p style="margin-top:12px">Volume ${index+1}: ${esc(s.volumes[index].title)}</p><form onsubmit="event.preventDefault();linkSeriesBook('${id}',${index},Number(this.book.value))"><label for="linkBook">Book in ${esc(s.owner)}’s collection</label><select id="linkBook" name="book" required><option value="">Choose a book</option>${available.map(b=>`<option value="${b.id}">${esc(b.title)}</option>`).join('')}</select><div class="actions"><button type="button" onclick="openSeries('${id}')">Cancel</button><button class="primary">Link book</button></div></form>`)}function linkSeriesBook(id,index,bookId){let s=seriesData.find(s=>s.id===id),b=books.find(b=>b.id===bookId);s.volumes[index].title=b.title;saveSeries();render();openSeries(id);toast('Book linked to series')}
function confirmDeleteSeries(id){show(`<h2>Delete series?</h2><p style="margin-top:12px">The series grouping will be removed. Its books stay in your collection.</p><div class="actions"><button onclick="openSeries('${id}')">Cancel</button><button class="danger" onclick="seriesData=seriesData.filter(s=>s.id!=='${id}');saveSeries();modal.close();render();toast('Series removed; books kept')">Delete series</button></div>`)}
modal.addEventListener('click',e=>{if(e.target===modal&&!modal.querySelector('.dialogClose')?.disabled){let r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});
// Standalone implementation of the same three-way Add Book flow as Librarium.
const lookupItems={};let lookupItemNumber=0;
function cleanISBN(value){return value.replace(/[^0-9Xx]/g,'').toUpperCase()}
function stashLookup(item){let id='lookup-'+(++lookupItemNumber);lookupItems[id]=item;return id}
function lookupCard(item,label='Use this book'){let id=stashLookup(item);return `<div class="lookupresult">${item.cover?`<img src="${esc(item.cover)}" alt="">`:''}<div><b>${esc(item.title||'Untitled')}</b><small>${esc(item.author||'Unknown author')}${item.year?' · '+esc(item.year):''}</small></div><button type="button" onclick="applyLookupItem('${id}')">${label}</button></div>`}
function applyLookupItem(id){let item=lookupItems[id],form=document.getElementById('bookForm');if(!item||!form)return;form.elements.title.value=item.title||'';form.elements.author.value=item.author||'';form.elements.isbn.value=item.isbn||form.elements.isbn.value;form.elements.coverData.value=item.cover||'';document.getElementById('coverStatus').textContent=item.cover?'✓ Cover and book details added from lookup.':'✓ Book details added from lookup.';toast('Book details added from lookup')}
function normaliseLookup(data,isbn){let source=data.book||data;let authors=source.authors||source.contributors||data.authors||[];return {title:source.title||data.title,author:authors.map(a=>typeof a==='string'?a:(a.name||a.full_name||'')).filter(Boolean).join(', '),cover:source.cover_url||data.cover_url||source.cover?.url||data.cover?.url,year:source.publish_date||data.publish_date,isbn:(source.isbn_13||data.isbn_13||[isbn])[0]||isbn}}
async function lookupISBN(){let form=document.getElementById('bookForm'),status=document.getElementById('lookupStatus'),result=document.getElementById('lookupResult'),isbn=cleanISBN(form.elements.isbn.value);form.elements.isbn.value=isbn;result.innerHTML='';if(isbn.length!==10&&isbn.length!==13){status.textContent='Enter a valid 10- or 13-digit ISBN.';return}status.textContent='Looking up ISBN…';try{let data;try{let response=await fetch('/api/v1/lookup/isbn/'+encodeURIComponent(isbn)+'/merged');if(!response.ok)throw new Error('No Librarium lookup');data=await response.json()}catch{let response=await fetch('https://openlibrary.org/api/books?format=json&jscmd=data&bibkeys=ISBN:'+encodeURIComponent(isbn));let row=(await response.json())['ISBN:'+isbn];if(!row)throw new Error('No match');data={title:row.title,authors:row.authors,cover_url:row.cover?.large||row.cover?.medium,publish_date:row.publish_date,isbn_13:[isbn]}}let item=normaliseLookup(data,isbn);if(!item.title)throw new Error('No match');status.textContent='Match found. Review the details, then add it to your library.';result.innerHTML=lookupCard(item)}catch{status.textContent='No book was found for that ISBN. You can still add it manually.'}}
async function searchBookTitle(){let query=document.getElementById('titleSearch').value.trim(),status=document.getElementById('lookupStatus'),result=document.getElementById('lookupResult');if(!query)return;status.textContent='Searching…';result.innerHTML='';try{let response=await fetch('https://openlibrary.org/search.json?limit=5&q='+encodeURIComponent(query)),docs=(await response.json()).docs||[];let items=docs.map(x=>({title:x.title,author:(x.author_name||[]).join(', '),year:x.first_publish_year,cover:x.cover_i?'https://covers.openlibrary.org/b/id/'+x.cover_i+'-M.jpg':'',isbn:(x.isbn||[])[0]||''}));status.textContent=items.length?'Choose a result to fill in the book details.':'No matching books found.';result.innerHTML=items.map(item=>lookupCard(item,'Use')).join('')}catch{status.textContent='Search is unavailable right now. Please try again or enter the book manually.'}}
function setBookMode(mode){document.querySelectorAll('.addtabs button').forEach(button=>button.classList.toggle('active',button.dataset.mode===mode));document.getElementById('isbnPane').hidden=mode!=='isbn';document.getElementById('searchPane').hidden=mode!=='search';document.getElementById('manualHint').hidden=mode!=='manual';document.getElementById('lookupStatus').textContent=mode==='isbn'?'Enter an ISBN to fill in the title, author and cover automatically.':mode==='search'?'Search by title or author, then choose a result.':'Enter the details below yourself.';document.getElementById('lookupResult').innerHTML=''}
function openBook(id=null,shelf=''){let book=books.find(x=>x.id===id),editing=!!book;show(`<div class="eyebrow">${editing?'Book details':'Add books'}</div><h1 style="font-size:37px">${editing?'Edit your book':'Add a book'}</h1>${editing?'':`<div class="addtabs"><button type="button" class="active" data-mode="isbn" onclick="setBookMode('isbn')">By ISBN</button><button type="button" data-mode="search" onclick="setBookMode('search')">By title</button><button type="button" data-mode="manual" onclick="setBookMode('manual')">Manual</button></div>`}<form id="bookForm" onsubmit="event.preventDefault();saveBook(${book?.id||'null'})"><div id="isbnPane" ${editing?'hidden':''}><label for="bookIsbn">ISBN</label><div class="lookuprow"><input id="bookIsbn" name="isbn" value="${esc(book?.isbn||'')}" placeholder="Scan or enter ISBN" inputmode="numeric"><button type="button" class="primary" onclick="lookupISBN()">Look up</button></div></div><div id="searchPane" hidden><label for="titleSearch">Title or author</label><div class="lookuprow"><input id="titleSearch" placeholder="Search the catalogue"><button type="button" class="primary" onclick="searchBookTitle()">Search</button></div></div><p id="manualHint" hidden style="font-size:11px;margin-top:12px">Enter the details below yourself.</p><p id="lookupStatus" class="lookupstatus">${editing?'':'Enter an ISBN to fill in the title, author and cover automatically.'}</p><div id="lookupResult" class="lookupresults"></div><label>Book title</label><input name="title" required value="${esc(book?.title||'')}" placeholder="e.g. The Hobbit"><label>Author</label><input name="author" required value="${esc(book?.author||'')}" placeholder="Author’s name"><label>Whose collection?</label><select name="owner">${['Safi','Adam','Caleb'].map(o=>`<option ${(book?.owner||(owner!=='Everyone'?owner:'Safi'))===o?'selected':''}>${o}</option>`).join('')}</select><label>Physical shelf</label><select name="shelf">${shelfOptions(book?.shelf||shelf)}</select><label>Cover image</label><input name="cover" type="file" accept="image/*" onchange="previewCover(this)"><input name="coverData" type="hidden" value="${esc(book?.cover||'')}"><p id="coverStatus" style="font-size:11px">${book?.cover?'Custom cover assigned.':'Upload a cover or take a photo from your phone.'}</p><div class="actions">${book?`<button type="button" class="danger" onclick="confirmDelete(${book.id})">Delete book</button>`:''}<button type="button" onclick="modal.close()">Cancel</button><button class="primary">${book?'Save changes':'Add book'}</button></div></form>`)}
